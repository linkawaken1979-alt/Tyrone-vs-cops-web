
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TYRONE vs COPS</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101014;
  font-family: "Segoe UI", Arial, sans-serif;
  color: #f2f2f2;
  user-select: none;
  touch-action: none;
}

#unity-container {
  position: absolute;
  inset: 0;
  background: #000;
}

#unity-canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #000;
  outline: none;
}

#loader {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #101014;
  z-index: 2;
  transition: opacity .4s ease;
}

#loader.done {
  opacity: 0;
  pointer-events: none;
}

#loader h1 {
  margin: 0 0 22px;
  font-size: 30px;
  letter-spacing: 4px;
  font-weight: 800;
  text-transform: uppercase;

  background: linear-gradient(
    90deg,
    #ff0000,
    #ff8800,
    #ffff00,
    #00ff00,
    #00ffff,
    #0088ff,
    #aa00ff,
    #ff0088,
    #ff0000
  );

  background-size: 300% 100%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: rainbow 4s linear infinite;
  filter: drop-shadow(0 2px 8px rgba(255,255,255,.15));
}

@keyframes rainbow {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}

#bar {
  width: min(360px, 80vw);
  height: 12px;
  background: #23232b;
  border: 1px solid #41414c;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,.5);
}

#fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(
    90deg,
    #ff0000,
    #ff8800,
    #ffff00,
    #00ff00,
    #00ffff,
    #0088ff,
    #aa00ff,
    #ff0088
  );
  background-size: 300% 100%;
  border-radius: 20px;
  transition: width .15s linear;
  animation: rainbow 3s linear infinite;
  box-shadow: 0 0 12px rgba(0,255,255,.35);
}

#status {
  margin-top: 17px;
  font-size: 14px;
  letter-spacing: 1.5px;
  min-height: 20px;

  background: linear-gradient(
    90deg,
    #ff5555,
    #ffcc55,
    #55ff99,
    #55ccff,
    #cc77ff,
    #ff5599
  );

  background-size: 300% 100%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: rainbow 4s linear infinite;
}

#percentage {
  margin-top: 8px;
  color: #aaaab8;
  font-size: 12px;
  letter-spacing: 1px;
}

#warning {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 12px;
  z-index: 3;
  text-align: center;
  font-size: 13px;
  color: #ff7777;
  white-space: pre-wrap;
  padding: 0 20px;
}
</style>
</head>

<body>

<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loader">
    <h1>TYRONE vs COPS</h1>

    <div id="bar">
      <div id="fill"></div>
    </div>

    <div id="status">Initializing...</div>
    <div id="percentage">0%</div>
  </div>
</div>

<div id="warning"></div>

<script>
(function () {
"use strict";

var container = document.getElementById("unity-container");
var canvas = document.getElementById("unity-canvas");
var loader = document.getElementById("loader");
var fill = document.getElementById("fill");
var status = document.getElementById("status");
var percentage = document.getElementById("percentage");
var warning = document.getElementById("warning");

var dataParts = 32;
var wasmParts = 3;

var completed = 0;
var total = dataParts + wasmParts;

function setProgress(value, message) {
  value = Math.max(0, Math.min(100, Math.round(value)));

  fill.style.width = value + "%";
  percentage.textContent = value + "%";

  if (message) {
    status.textContent = message;
  }
}

function showWarning(message) {
  warning.textContent = message;
  status.textContent = "Loading failed";
}

function absoluteURL(path) {
  return new URL(path, window.location.href).href;
}

/*
 * Download chunks sequentially to avoid creating
 * 35 simultaneous large download requests.
 */
async function loadChunks(filename, count) {
  var chunks = [];

  for (var i = 0; i < count; i++) {
    var part = String(i).padStart(3, "0");

    var url = absoluteURL(
      "Build/" + filename + ".part" + part
    );

    status.textContent =
      "Downloading " + filename + " (" + (i + 1) + "/" + count + ")";

    var response = await fetch(url, {
      cache: "force-cache"
    });

    if (!response.ok) {
      throw new Error(
        "Failed to download " + filename +
        ".part" + part + ": HTTP " + response.status
      );
    }

    chunks.push(await response.arrayBuffer());

    completed++;

    setProgress(
      completed / total * 65,
      "Downloading game files..."
    );
  }

  return new Blob(chunks, {
    type: "application/octet-stream"
  });
}

/*
 * Download the build configuration and replace
 * the original data/code URLs with reconstructed
 * in-memory Blob URLs.
 */
async function prepareBuild() {
  setProgress(0, "Preparing game...");

  var configResponse = await fetch(
    absoluteURL("Build/WebGL.json"),
    { cache: "no-cache" }
  );

  if (!configResponse.ok) {
    throw new Error("Could not load Build/WebGL.json");
  }

  var config = await configResponse.json();

  setProgress(0, "Downloading game data...");

  var dataBlob = await loadChunks(
    "WebGL.data.unityweb",
    dataParts
  );

  setProgress(65, "Downloading WebGL code...");

  var wasmBlob = await loadChunks(
    "WebGL.wasm.code.unityweb",
    wasmParts
  );

  var dataURL = URL.createObjectURL(dataBlob);
  var wasmURL = URL.createObjectURL(wasmBlob);

  /*
   * Rewrite matching configuration entries.
   * Keep framework and other build resources intact.
   */
  var replacedData = false;
  var replacedWasm = false;

  Object.keys(config).forEach(function (key) {
    var value = config[key];

    if (typeof value !== "string") return;

    if (value.indexOf("WebGL.data.unityweb") !== -1) {
      config[key] = dataURL;
      replacedData = true;
    }

    if (value.indexOf("WebGL.wasm.code.unityweb") !== -1) {
      config[key] = wasmURL;
      replacedWasm = true;
    }

    /*
     * Convert remaining relative build paths to
     * absolute URLs so the configuration still works
     * when loaded through a Blob URL.
     */
    if (
      !replacedData &&
      !replacedWasm &&
      !/^blob:|^data:|^https?:|^\/\//i.test(config[key])
    ) {
      config[key] = absoluteURL(config[key]);
    }
  });

  if (!replacedData || !replacedWasm) {
    throw new Error(
      "Could not find the expected dataUrl/wasmCodeUrl " +
      "entries in WebGL.json. Check the build configuration."
    );
  }

  var configBlob = new Blob(
    [JSON.stringify(config)],
    { type: "application/json" }
  );

  var configURL = URL.createObjectURL(configBlob);

  setProgress(70, "Starting Unity...");

  return configURL;
}

function startUnity(configURL) {
  if (
    typeof UnityLoader === "undefined" ||
    !UnityLoader.instantiate
  ) {
    throw new Error("UnityLoader.js failed to initialize.");
  }

  UnityLoader.instantiate(container, configURL, {
    onProgress: function (progress) {
      var pct = 70 + progress * 30;

      setProgress(
        pct,
        progress >= 1 ? "Starting game..." : "Loading game..."
      );

      if (progress >= 1) {
        setTimeout(function () {
          loader.className = "done";
          canvas.focus();

          setTimeout(function () {
            loader.style.display = "none";
          }, 450);
        }, 400);
      }
    },

    onError: function (message) {
      showWarning(String(message));
    },

    webglContextAttributes: {
      alpha: false,
      antialias: false,
      depth: true,
      stencil: true,
      premultipliedAlpha: true,
      preserveDrawingBuffer: false,
      powerPreference: "high-performance"
    }
  });
}

async function boot() {
  try {
    var configURL = await prepareBuild();

    startUnity(configURL);

  } catch (error) {
    console.error(error);

    showWarning(
      error && error.message
        ? error.message
        : String(error)
    );
  }
}

window.addEventListener("contextmenu", function (event) {
  event.preventDefault();
});

var script = document.createElement("script");

script.src = "Build/UnityLoader.js";
script.async = true;

script.onload = boot;

script.onerror = function () {
  showWarning(
    "Could not load Build/UnityLoader.js. " +
    "Serve this folder over HTTP."
  );
};

document.body.appendChild(script);

})();
</script>

</body>
</html>
